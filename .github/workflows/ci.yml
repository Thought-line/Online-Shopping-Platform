name: Online Shopping Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  repository-check:
    name: Check repository files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify README exists
        run: |
          if [ -f README.md ]; then
            echo "README.md found."
          else
            echo "README.md is missing."
            exit 1
          fi

      - name: Complete workflow
        run: echo "Online Shopping Platform repository check passed."
